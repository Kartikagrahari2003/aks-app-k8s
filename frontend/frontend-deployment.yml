apiVersion: apps/v1
kind: Deployment

metadata:
  name: aks-app-frontend
  namespace: aks-app
  labels:
    app: aks-app-frontend
    component: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: aks-app-frontend

  template:
    metadata:
      labels:
        app: aks-app-frontend
        component: frontend

    spec:
      containers:
        - name: aks-app-frontend
          image: kartikagrahari2003/aks-frontend:v1
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"